apply plugin: 'com.android.application'

// ─── Hook: executa npm run build + cap sync antes de qualquer build Android ───
// Isso garante que o app_version.txt e os assets do React sejam sempre atualizados.
task npmBuildAndSync(type: Exec) {
    description = 'Roda npm run build e npx cap sync antes de gerar o APK'
    workingDir '../../'  // raiz do projeto React

    onlyIf {
        !project.hasProperty('skipNpmBuild') && System.getenv('SKIP_NPM_BUILD') != '1'
    }

    // Canal de atualização embutido no JS: AAB (bundle*) = Play Store; APK = download direto.
    // Pode ser forçado com VITE_ANDROID_UPDATE_CHANNEL=play|apk.
    def isBundleBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
    environment 'VITE_ANDROID_UPDATE_CHANNEL',
        System.getenv('VITE_ANDROID_UPDATE_CHANNEL') ?: (isBundleBuild ? 'play' : 'apk')

    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (isWindows) {
        commandLine 'powershell', '-ExecutionPolicy', 'Bypass', '-Command', 'npm run build:android'
    } else {
        commandLine 'bash', '-c', 'npm run build:android'
    }
}

preBuild.dependsOn npmBuildAndSync
// ─────────────────────────────────────────────────────────────────────────────

// ─── Identificador do app (applicationId) ───────────────────────────────────
// Desde nov/2026 o app é br.com.sigesapp. A versão de TRANSIÇÃO (última do pacote
// antigo, com a tela de migração) é gerada com SIGES_APPLICATION_ID=com.ag.siges.
// O pacote Java (namespace com.ag.siges) não muda.
def sigesApplicationId = (System.getenv('SIGES_APPLICATION_ID')
        ?: project.findProperty('sigesApplicationId')
        ?: 'br.com.sigesapp').toString().trim()
// ─────────────────────────────────────────────────────────────────────────────
// ─── Auto-increment versionCode ─────────────────────────────────────────────
// Lê o version_app_mask do app_version.txt e gera versionCode automaticamente
def getAppVersion = { ->
    // O versionName/versionCode é lido na CONFIGURAÇÃO do Gradle, antes do hook
    // npmBuildAndSync gravar a versão nova no app_version.txt. Se a versão veio por
    // APP_VERSION (build-apk.sh/ps1 <versão>), usa ela já aqui — senão o APK sairia
    // com a versão anterior (ex.: arquivo/JS 1.1.64, Android 1.1.63).
    def envVersion = System.getenv('APP_VERSION')
    if (envVersion?.trim()) return envVersion.trim()
    try {
        def versionFile = file('../../public/app_version.txt')
        if (versionFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(versionFile.text)
            return json.version_app_mask ?: '1.0.0'
        }
    } catch (Exception e) {
        println "Erro ao ler versão: ${e.message}"
    }
    return '1.0.0'
}

def getVersionCode = { ->
    def version = getAppVersion()
    def parts = version.split('\\.')
    // Converte major*10000 + minor*100 + patch para versionCode
    def major = parts.length > 0 ? Integer.parseInt(parts[0]) : 1
    def minor = parts.length > 1 ? Integer.parseInt(parts[1]) : 0
    def patch = parts.length > 2 ? Integer.parseInt(parts[2]) : 0
    return major * 10000 + minor * 100 + patch
}
// ─────────────────────────────────────────────────────────────────────────────

// ─── Assinatura: lida de android/keystore.properties (fora do Git) ou de variáveis
// de ambiente. Nunca coloque senha ou keystore neste arquivo.
//   storeFile=/caminho/absoluto/siges-release.jks   (ou relativo a android/app)
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String envName ->
    keystoreProps.getProperty(key) ?: System.getenv(envName)
}
def releaseStoreFile = signingValue('storeFile', 'SIGES_KEYSTORE_FILE')
def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists()
// ─────────────────────────────────────────────────────────────────────────────

android {
    namespace = "com.ag.siges"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId sigesApplicationId
        // Antes fixos em strings.xml; agora acompanham o applicationId.
        resValue "string", "package_name", sigesApplicationId
        resValue "string", "custom_url_scheme", sigesApplicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getVersionCode()
        versionName getAppVersion()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'SIGES_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'SIGES_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'SIGES_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sem keystore configurado, o debug usa a chave de debug padrão do Android.
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Google Play services (Fused Location + Activity Recognition)
    implementation "com.google.android.gms:play-services-location:21.3.0"

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}


// Falha cedo (em vez de gerar um release sem assinatura) quando falta o keystore.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
    if (wantsRelease && !hasReleaseSigning) {
        throw new GradleException(
            'Keystore de release não configurado. Crie android/keystore.properties ' +
            '(ver android/keystore.properties.example) ou defina SIGES_KEYSTORE_FILE, ' +
            'SIGES_KEYSTORE_PASSWORD, SIGES_KEY_ALIAS e SIGES_KEY_PASSWORD.')
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
