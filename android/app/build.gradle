apply plugin: 'com.android.application'

// ─── Hook: executa npm run build + cap sync antes de qualquer build Android ───
// Isso garante que o app_version.txt e os assets do React sejam sempre atualizados.
task npmBuildAndSync(type: Exec) {
    description = 'Roda npm run build e npx cap sync antes de gerar o APK'
    workingDir '../../'  // raiz do projeto React

    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (isWindows) {
        commandLine 'powershell', '-ExecutionPolicy', 'Bypass', '-Command', 'npm run build:android'
    } else {
        commandLine 'bash', '-c', 'npm run build:android'
    }
}

preBuild.dependsOn npmBuildAndSync
// ─────────────────────────────────────────────────────────────────────────────

// ─── Auto-increment versionCode ─────────────────────────────────────────────
// Lê o version_app_mask do app_version.txt e gera versionCode automaticamente
def getAppVersion = { ->
    try {
        def versionFile = file('../../public/app_version.txt')
        if (versionFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(versionFile.text)
            return json.version_app_mask ?: '1.0.0'
        }
    } catch (Exception e) {
        println "Erro ao ler versão: ${e.message}"
    }
    return '1.0.0'
}

def getVersionCode = { ->
    def version = getAppVersion()
    def parts = version.split('\\.')
    // Converte major*10000 + minor*100 + patch para versionCode
    def major = parts.length > 0 ? Integer.parseInt(parts[0]) : 1
    def minor = parts.length > 1 ? Integer.parseInt(parts[1]) : 0
    def patch = parts.length > 2 ? Integer.parseInt(parts[2]) : 0
    return major * 10000 + minor * 100 + patch
}
// ─────────────────────────────────────────────────────────────────────────────

android {
    namespace = "com.ag.siges"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ag.siges"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getVersionCode()
        versionName getAppVersion()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Google Play services (Fused Location + Activity Recognition)
    implementation "com.google.android.gms:play-services-location:21.3.0"

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}


apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
