server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Hashed Vite assets: safe to cache immutably for 1 year.
    # NOTE: scoped to /assets/ only — a new deploy generates new hashes,
    # so old files are never requested again after index.html refreshes.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Static assets must NEVER trigger SPA fallback: a missing hashed
        # chunk means stale index.html — return 404 so lazyWithRetry can
        # detect it and force a clean reload (instead of serving index.html
        # with 200, which breaks dynamic import() with a MIME error).
    }

    # Static files with short cache (logos, manifest, etc.)
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Entry point + service workers: NEVER cache at origin or edge.
    # index.html references hashed chunk filenames that change on every
    # deploy. Caching it (browser, SW or Cloudflare) serves a stale file
    # list -> "Failed to fetch dynamically imported module" on lazy routes.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location = /sw-update.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Belt-and-braces: navigations fall back to index.html, which must
        # always be revalidated so clients pick up new chunk hashes.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }
}