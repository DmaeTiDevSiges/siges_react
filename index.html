<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <!-- Prevent browser/CDN from caching index.html (Vite hashed assets handle their own cache) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- Content Security Policy. Cloudflare challenge/beacon hosts are allowlisted so the
         Managed Challenge ("Verificando se você é humano") and Turnstile can load their
         scripts/iframes. Without them the challenge spins forever on mobile UAs. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://storage.googleapis.com https://challenges.cloudflare.com https://ajax.cloudflare.com https://static.cloudflareinsights.com; worker-src 'self' blob: data:; child-src 'self' blob: https://challenges.cloudflare.com; frame-src 'self' blob: https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: wss: blob: data: https://challenges.cloudflare.com https://cloudflareinsights.com;">
    <!-- Updated viewport settings for better keyboard handling on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>SIGES - Sistema de Gestão de Serviços</title>
    <meta name="description"
        content="Sistema de Gestão de Serviços (SIGES) - Plataforma completa para gerenciamento operacional, ativos e contratos.">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SIGES">
    <link rel="apple-touch-icon" href="/siges_logo.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://siges.app/">
    <meta property="og:title" content="SIGES - Sistema de Gestão de Serviços">
    <meta property="og:description" content="Plataforma completa para gerenciamento operacional, ativos e contratos.">
    <meta property="og:image" content="/og-image.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased overflow-x-hidden">
    <script>
        window.onerror = function(msg, url, line, col, error) {
            var el = document.getElementById('root');
            if (el) {
                el.innerHTML = '<pre style="color:red;padding:20px;white-space:pre-wrap;font-size:14px;">' +
                    'ERROR: ' + msg + '\n' + url + ':' + line + ':' + col +
                    (error && error.stack ? '\n\n' + error.stack : '') + '</pre>';
            }
            return false;
        };
        window.onunhandledrejection = function(e) {
            var el = document.getElementById('root');
            if (el) {
                el.innerHTML = '<pre style="color:red;padding:20px;white-space:pre-wrap;font-size:14px;">' +
                    'UNHANDLED PROMISE REJECTION: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) +
                    '</pre>';
            }
        };
    </script>
    <script>
        (function() {
            var theme = localStorage.getItem('app_theme');
            if (theme === 'dark' || (!theme && true)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        // Single service-worker registration (scope "/"). UpdateNotifier.tsx must NOT
        // register a second SW (it used to register /sw-update.js, same scope — the two
        // registrations raced and clients could end up with a stale cache). updateViaCache
        // "none" guarantees the browser revalidates sw.js on every navigation, so a new
        // deploy's hashed chunks are picked up instead of serving stale index.html.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(function() {});
        }
    </script>
</body>

</html>
